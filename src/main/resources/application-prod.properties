spring.main.banner-mode=off
spring.output.ansi.enabled=never

# Todos os valores abaixo vem do .env via docker-compose.prod.yaml.
# Nenhum segredo e versionado neste arquivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Precisa ser Base64 valido: e decodificado em JwtHandlerImpl.init()
farm.jwt.token.secret=${JWT_SECRET}
farm.jwt.token.expiration=${JWT_EXPIRATION:15778800}

# SecurityConfig usa addAllowedOrigin (match exato, sem wildcard).
# Como tudo e servido pela mesma origem atras do Caddy, aqui vai so o dominio real.
farm.cors.origins=${CORS_ORIGINS}

# Faz o Spring enxergar o esquema https a partir do X-Forwarded-Proto do Caddy.
server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.com.dev.farmmanager=INFO

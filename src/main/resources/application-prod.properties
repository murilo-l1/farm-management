spring.main.banner-mode=off
spring.output.ansi.enabled=never

# Porta em que o Spring escuta.
#   - Imagem all-in-one (Cloud Run / Railway / Render): o Dockerfile define
#     SERVER_PORT=8081 e o Caddy fica com a porta publica $PORT.
#   - Backend sozinho numa PaaS: cai no $PORT injetado pela plataforma.
#   - docker-compose na VM: nenhum dos dois existe, usa 8080.
server.port=${SERVER_PORT:${PORT:8080}}

# Todos os valores abaixo vem de variavel de ambiente.
# Nenhum segredo e versionado neste arquivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 3s (do application.properties) so serve para um Postgres local na mesma
# maquina. Contra banco gerenciado - Railway, Neon - a primeira conexao
# estoura e a requisicao falha. 30s da folga.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Precisa ser Base64 valido: e decodificado em JwtHandlerImpl.init()
farm.jwt.token.secret=${JWT_SECRET}
farm.jwt.token.expiration=${JWT_EXPIRATION:15778800}

# SecurityConfig usa addAllowedOrigin (match exato, sem wildcard).
# Serve a origem publica real, com esquema e sem barra no fim.
farm.cors.origins=${CORS_ORIGINS}

# Faz o Spring enxergar https a partir do X-Forwarded-Proto do proxy
# (Caddy na VM, edge do Railway/Cloud Run/Render).
server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.com.dev.farmmanager=INFO

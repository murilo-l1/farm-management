services:
  database:
    image: postgres:18
    container_name: farm-database
    restart: unless-stopped
    networks: [farm_network]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PGDATA explícito num subdiretório do volume: a imagem postgres:18
      # mudou o caminho padrão, e assim o comportamento fica previsível.
      PGDATA: /farm/data/pgdata
    volumes:
      # Só rodam no primeiro boot, com o volume vazio.
      # Prod leva só o schema + a conta de demonstração; o mock_data.sql
      # (teste@email.com) é seed de desenvolvimento e fica só no compose local.
      - ./docker/init/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docker/init/demo_data.sql:/docker-entrypoint-initdb.d/02_demo_data.sql:ro
      - farm-database-volume:/farm/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options: { max-size: "5M", max-file: "3" }
    # Sem "ports": o banco só é alcançável pela rede interna do compose.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farm-api
    restart: unless-stopped
    networks: [farm_network]
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: "json-file"
      options: { max-size: "5M", max-file: "3" }
    # Sem "ports": só o Caddy fala com a API.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farm-web
    restart: unless-stopped
    networks: [farm_network]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Persistem os certificados Let's Encrypt entre restarts.
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options: { max-size: "5M", max-file: "3" }

volumes:
  farm-database-volume:
  caddy-data:
  caddy-config:

networks:
  farm_network:
    driver: bridge
